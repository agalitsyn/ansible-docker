---

- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: "agalitsyn.docker supports Debian-family distributions only, got {{ ansible_facts['os_family'] }}"
    quiet: true

- name: Install repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Fetched to a dedicated keyring rather than the global trusted set, so
# this key can only ever sign packages from the Docker repository.
- name: Fetch the Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Determine the apt architecture
  ansible.builtin.set_fact:
    docker_apt_architecture: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}[ansible_facts['architecture']]
         | default(ansible_facts['architecture']) }}

- name: Check whether Docker publishes for this Ubuntu release
  ansible.builtin.uri:
    url: "{{ docker_apt_uri }}/dists/{{ docker_apt_suite }}/Release"
    method: HEAD
    status_code: [200, 403, 404]
  register: docker_suite_probe
  changed_when: false
  check_mode: false

- name: Select the apt suite
  ansible.builtin.set_fact:
    docker_apt_suite_effective: >-
      {{ docker_apt_suite if docker_suite_probe.status == 200 else docker_apt_suite_fallback }}

- name: Warn when falling back to an older suite
  ansible.builtin.debug:
    msg: >-
      Docker has no packages for '{{ docker_apt_suite }}' yet, falling back to
      '{{ docker_apt_suite_fallback }}'.
  when: docker_suite_probe.status != 200

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_uri }}"
    suites: ["{{ docker_apt_suite_effective }}"]
    components: ["{{ docker_apt_components }}"]
    architectures: ["{{ docker_apt_architecture }}"]
    signed_by: "{{ docker_apt_keyring }}"
    enabled: true
    state: present
  register: docker_repo

# apt_repository used to leave a legacy one-line entry behind; remove it so
# the same repository is not configured twice.
- name: Remove the legacy one-line Docker repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    - /etc/apt/sources.list.d/docker.list

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages + docker_extra_packages }}"
    state: present
    update_cache: true

- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Configure ufw for Docker
  ansible.builtin.include_tasks:
    file: ufw.yml
    apply:
      tags: [ufw, security]
  when: docker_ufw_integration | bool
  tags: [ufw, security]

- name: Apply Docker configuration now
  ansible.builtin.meta: flush_handlers

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"

# `groups` + `append`, not `group`: the latter would replace the account's
# primary group with `docker`.
- name: Add user to the docker group
  ansible.builtin.user:
    name: "{{ docker_group_member }}"
    groups: docker
    append: true
  when: docker_group_member | length > 0

- name: Verify Docker and Compose
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
    - docker compose version --short
  register: docker_verify
  changed_when: false

- name: Report installed versions
  ansible.builtin.debug:
    msg: "docker {{ docker_verify.results[0].stdout }} / compose {{ docker_verify.results[1].stdout }}"
